name: Apalod Cinemax Studio - Cloud Rendering Pipeline

on:
  repository_dispatch:
    types: [movie_explainer_render, movie_explainer_job]
  workflow_dispatch:
    inputs:
      movie_title:
        description: 'Movie Title'
        required: true
        default: 'Runner (2026)'
      source_url:
        description: 'Seedr Zip, Telegram MP4 or Direct Movie URL'
        required: true
        default: 'https://nw17.seedr.cc/get_zip_ngen_free/29719107/Runner%20%282026%29%20720p%20WEBRip%20x264%20-YTS.zip?st=MA9ryMs57UoSPJC2SDa_vQ&e=1791397658'
      voice_name:
        description: 'Neural Voice Model'
        required: false
        default: 'si-LK-SameeraNeural'

jobs:
  render_cinemax_recap:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Video Processing & Neural AI Dependencies
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          which aria2c || sudo apt-get install -y aria2
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Apalod Cinemax Explainer Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || github.event.client_payload.geminiApiKey }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || github.event.client_payload.telegramBotToken }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || github.event.client_payload.telegramChannel || '-1004294803559' }}
          VOICE_NAME: ${{ github.event.client_payload.voice || github.event.inputs.voice_name || 'si-LK-SameeraNeural' }}
          CUSTOM_SCRIPT: ${{ github.event.client_payload.customScript }}
        run: |
          python pipeline.py \
            --title "${{ github.event.client_payload.movieTitle || github.event.inputs.movie_title || 'Runner (2026)' }}" \
            --source "${{ github.event.client_payload.sourceUrl || github.event.inputs.source_url }}" \
            --voice "${VOICE_NAME}"

      - name: Archive Generated Video Clips as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinemax-scene-clips
          path: |
            output_scenes/*.mp4
            output_scenes/*.mp3
          retention-days: 14
